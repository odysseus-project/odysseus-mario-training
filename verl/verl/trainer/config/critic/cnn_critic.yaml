# CNN Critic Configuration for Vision-based RL
# This configuration is for game environments where observations are images.

# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.cnn_critic_worker.CNNCriticConfig

# Number of rollouts per update (mirrors actor rollout_n)
rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

strategy: cnn

enable: null

# NCCL timeout in seconds
nccl_timeout: 600

# ============================================================
# Model Configuration
# ============================================================
model:
  # Model architecture: "simple" (CNNCriticModel) or "nature" (NatureCNN)
  # - "simple": 3 conv layers with batch norm, good for smaller images
  # - "nature": Nature DQN architecture, designed for 84x84 images
  architecture: nature

  # Input image dimensions
  # For Super Mario Land: 160x144 (or resize_ratio applied)
  input_channels: 3
  input_height: 144
  input_width: 160

  # Hidden layer dimension for fully connected layers
  hidden_dim: 256

  # Whether to use batch normalization (only for "simple" architecture)
  use_batch_norm: true

  # Key to access images in the data batch
  # Common options: "pixel_values", "images", "image"
  image_key: pixel_values

# ============================================================
# Optimizer Configuration
# ============================================================
# Learning rate
lr: 3e-4

# Weight decay for regularization
weight_decay: 0.0

# Warmup steps ratio; total steps will be injected at runtime
lr_warmup_steps_ratio: 0.0

# Total training steps (must be overridden at runtime)
total_training_steps: -1

# ============================================================
# PPO Configuration
# ============================================================

# PPO mini-batch size per update
ppo_mini_batch_size: ${oc.select:actor_rollout_ref.actor.ppo_mini_batch_size,256}

# [Deprecated] Global micro batch size
ppo_micro_batch_size: null

# Local per-GPU micro batch size
ppo_micro_batch_size_per_gpu: ${oc.select:.ppo_micro_batch_size,null}

# Whether to automatically adjust batch size at runtime
use_dynamic_bsz: ${oc.select:actor_rollout_ref.actor.use_dynamic_bsz,false}

# Max tokens per GPU in one PPO batch (doubled for critic)
ppo_max_token_len_per_gpu: 32768

# Max token length per GPU in forward pass
forward_max_token_len_per_gpu: ${.ppo_max_token_len_per_gpu}

# Number of PPO epochs per batch
ppo_epochs: ${oc.select:actor_rollout_ref.actor.ppo_epochs,1}


# ============================================================
# Training Configuration
# ============================================================
# Gradient clipping max norm
grad_clip: 1.0

# Value loss clipping range (PPO value clipping)
cliprange_value: 0.2

# Loss aggregation mode: "mean" or "sum"
loss_agg_mode: mean

