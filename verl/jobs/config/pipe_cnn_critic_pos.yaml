# Migrated from colm_jobs/slurm/pipe_abalation/qwen3_vl_8b_pipe_cnn_critic_pos.slurm
defaults:
- base_pipe
- _self_
- optional smoke: null
- override critic: cnn_critic
algorithm:
  adv_estimator: reinforce_plus_plus_pos
data:
  max_prompt_length: 2048
  max_response_length: 1024
actor_rollout_ref:
  actor:
    ppo_max_token_len_per_gpu: 8192
  ref:
    log_prob_max_token_len_per_gpu: 32768
  rollout:
    multi_turn:
      markov_discount_factor: 0.95
    max_model_len: 32768
critic:
  enable: true
  model:
    architecture: nature
    input_channels: 3
    input_height: 144
    input_width: 160
    hidden_dim: 512
    image_key: pixel_values
  lr: 0.0003
  weight_decay: 0.0
  ppo_mini_batch_size: 512
  ppo_epochs: 1
  grad_clip: 1.0
  cliprange_value: 0.2
  loss_agg_mode: mean
trainer:
  critic_warmup: 5
  save_freq: 5
  test_freq: 20
hydra:
  searchpath:
  - file://${oc.env:ODYSSEUS_VERL_ROOT}/verl/trainer/config
